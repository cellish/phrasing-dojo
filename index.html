<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="クラシックの抑揚とジャズのアーティキュレーションを練習するドリル / A drill for classical phrasing and jazz articulation.">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>フレージング道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Music&display=swap">
<style>
/* Layout: one centered practice column — score sheet card on top, principle index below. */
:root{
  --bg:#EEF0F4; --panel:#FFFFFF; --ink:#1B2130; --muted:#5B6274; --line:#D6DAE3;
  --accent:#3646A3; --accent-soft:#E2E5F6; --good:#24795A; --good-soft:#DFF1E8;
  --warn:#A9562A; --warn-soft:#F7E7DD; --c2:#B0602A; --c3:#25817F;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-music:"Noto Music","Bravura","Segoe UI Symbol","Apple Symbols",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11141B; --panel:#1A1E28; --ink:#E5E8EF; --muted:#9AA1B3; --line:#2E3443;
  --accent:#9AA6FF; --accent-soft:#272D4C; --good:#62C796; --good-soft:#1D3329;
  --warn:#E89C6A; --warn-soft:#3A2A20; --c2:#E39A63; --c3:#5CC6C2; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11141B; --panel:#1A1E28; --ink:#E5E8EF; --muted:#9AA1B3; --line:#2E3443;
  --accent:#9AA6FF; --accent-soft:#272D4C; --good:#62C796; --good-soft:#1D3329;
  --warn:#E89C6A; --warn-soft:#3A2A20; --c2:#E39A63; --c3:#5CC6C2; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:1.9rem;margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:.92rem}
.score{margin-left:auto;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;padding:6px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--panel)}
.chips{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.cgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg.grp button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.seg.grp button{padding:5px 14px;font-size:.85rem}
.cmptag{margin-left:6px;font-size:.68rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px}
.bar .chips{flex:1 1 auto;min-width:0}
.glbl{font-size:.75rem;color:var(--muted);font-weight:700;margin-right:2px}
.seg.mode{padding:2px}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.seg.mode button{padding:5px 14px;font-size:.88rem}
.pgh{grid-column:1/-1;margin:8px 0 -2px;font-size:.8rem;color:var(--muted);letter-spacing:.04em}
@media (max-width:620px){.cgroup{padding-left:0;border-left:0}}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:.82rem;padding:4px 11px;border-radius:999px;cursor:pointer}
.chip .cn{display:inline-block;min-width:1.4em;margin-right:5px;padding:0 4px;border-radius:999px;background:var(--bg);color:var(--muted);font-weight:700;font-size:.75rem;text-align:center;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .cn{background:var(--panel);color:var(--accent)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.tag{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.tag small{font-family:var(--f-body);font-weight:500;font-size:.78rem;letter-spacing:.08em;color:var(--accent);margin-right:8px}
.count{margin-left:auto;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.pdesc{margin:-6px 0 0;color:var(--muted);font-size:.9rem}

.scroller{overflow-x:auto;margin:0 -6px;padding:0 6px}
.scroller svg{display:block;width:100%;min-width:520px;height:auto}
.staff-line,.bar-line,.ledger{stroke:var(--ink);stroke-width:1}
.staff-line{opacity:.55}
.bar-line.end{stroke-width:3}
.glyph{fill:var(--ink)}
.chord{fill:var(--muted);font-family:var(--f-body);font-size:11px;font-weight:700}
.note .head{fill:var(--ink);stroke:var(--ink);stroke-width:1.5}
.note .head.hollow{fill:var(--panel)}
.note .stem,.note .flag{stroke:var(--ink);stroke-width:1.3;fill:none}
.note .dot,.note .acc{fill:var(--ink)}
.note .hit{fill:transparent;cursor:pointer}
.note .ring{fill:none;stroke:transparent;stroke-width:2}
.pickable .note:hover .head{fill:var(--accent);stroke:var(--accent)}
.pickable .note:hover .head.hollow{fill:var(--accent-soft)}
.note.sounding .head{fill:var(--accent);stroke:var(--accent)}
.note.sounding .head.hollow{fill:var(--accent-soft)}
.note.chosen .head{fill:var(--warn);stroke:var(--warn)}
.note.chosen .head.hollow{fill:var(--warn-soft)}
.note.chosen.right .head{fill:var(--good);stroke:var(--good)}
.note.chosen.right .head.hollow{fill:var(--good-soft)}
.note.best .ring{stroke:var(--good)}
.note.alt .ring{stroke:var(--good);stroke-dasharray:3 3}

.curve-grid{stroke:var(--line);stroke-width:1}
.curve-label{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.curve-line{fill:none;stroke-width:2.2;stroke-linejoin:round}
.curve-line.model{stroke-width:4;stroke-opacity:.55}
.clegend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.82rem;color:var(--muted);align-items:center}
.clegend span{display:inline-flex;align-items:center;gap:6px}
.clegend svg{flex:none}
.clegend b{color:var(--ink)}
.clegend .note{flex-basis:100%}
.curve-dot{stroke:var(--panel);stroke-width:1.5}

.prompt{margin:0;font-size:.95rem}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:.9rem;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn .tri{width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:0}
.opt .lbl{font-family:var(--f-display);font-weight:800;font-size:1.4rem;line-height:1;display:flex;align-items:center;gap:8px}
.opt .sw{width:18px;height:4px;border-radius:2px;display:none}
.answered .opt .sw{display:inline-block}
.opt.picked{border-color:var(--warn)}
.opt.model{border-color:var(--good);background:var(--good-soft)}
.opt .what{font-size:.82rem;color:var(--muted);min-height:1.2em}

.feedback{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin:0}
.verdict.good{color:var(--good)} .verdict.mid{color:var(--accent)} .verdict.bad{color:var(--warn)}
.feedback p{margin:0;max-width:65ch}
.feedback .hint{color:var(--muted)}
.vlist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.vlist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border-radius:9px;background:var(--bg)}
.vlist .k{font-family:var(--f-display);font-weight:800}
.vlist b{font-weight:700}
.nav{display:flex;gap:6px}
.nav .btn{padding:6px 12px;font-size:.85rem}
.nav .btn.next{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.principles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;padding:4px 2px}
.principles h2{grid-column:1/-1;font-family:var(--f-display);font-size:1.05rem;margin:0}
.pr{display:grid;grid-template-columns:2em minmax(0,1fr);gap:4px;font-size:.88rem}
.pr .n{font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:1.1rem;line-height:1.5}
.pr b{display:block}
.pr span{color:var(--muted)}
.note-foot{font-size:.82rem;color:var(--muted);margin:0;max-width:70ch}
@media (max-width:620px){
  .opts{grid-template-columns:minmax(0,1fr)}
  .opt{flex-direction:row;flex-wrap:wrap;align-items:center}
  .opt .what{flex-basis:100%}
  .principles{grid-template-columns:minmax(0,1fr)}
  .card{padding:16px 14px}
  .score{margin-left:0;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
svg[hidden]{display:none}
.seg.lang{padding:2px}
.seg.lang button{padding:4px 11px;font-size:.8rem}
.seg.style button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
header.top .sub{flex:1 1 180px;min-width:0}
.prefs{margin-left:auto;position:relative}
.gear{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;padding:6px 14px}
.gear[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.settings{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);min-width:max-content}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px}
.slbl{font-size:.8rem;color:var(--muted);font-weight:700}
.psel{display:inline-flex;align-items:center;gap:8px}
.psel select{font:inherit;font-size:.85rem;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);max-width:100%;cursor:pointer}
.psel select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:620px){.psel{flex-basis:100%}.psel select{flex:1;min-width:0}}
.bar .score{margin:0 0 0 auto}
.beam{fill:var(--ink)}
.rest{fill:var(--ink);stroke:var(--ink)}
.rest-q{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.tie{fill:none;stroke:var(--ink);stroke-width:1.4}
.bracket{stroke:var(--muted);stroke-width:1.2}
.mark{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mark.light{opacity:.4}
.mark.user{stroke:var(--accent)}
.paren{fill:var(--ink);font-size:15px;font-family:Georgia,serif}
.paren.user{fill:var(--accent)}
.sdot{fill:var(--ink)}
.tuplet{fill:var(--ink);font:italic 700 12px Georgia,serif}
.subt{font-family:var(--f-body);font-weight:700;font-size:.85rem;color:var(--accent);margin-left:10px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);vertical-align:middle}
.acc-line{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round}
.acc-bar{stroke:var(--ink);stroke-width:3}
.sdot.user{fill:var(--accent)}
.mark.given{stroke:var(--muted);opacity:.55}
.pickable .note.fixed:hover .head{fill:var(--ink);stroke:var(--ink)}
.note.fixed .hit{cursor:default}
.sdot.given{fill:var(--muted);opacity:.55}
.paren.given{fill:var(--muted);opacity:.55}
.note.sel-a .head,.note.sel-g .head{fill:var(--accent);stroke:var(--accent)}
.note.sel-g .head{opacity:.55}
.note.missed .ring{stroke:var(--good)}
.note.extra .head{fill:var(--warn);stroke:var(--warn)}
.note.hit .head{fill:var(--good);stroke:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}
.legend b{color:var(--ink);font-family:Georgia,serif;font-weight:700;margin-right:3px}
.tally{display:flex;flex-wrap:wrap;gap:8px}
.tally span{font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--bg);font-variant-numeric:tabular-nums}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="h1">フレージング道場</h1>
    <div class="seg style" role="tablist" aria-label="スタイル">
      <button id="style-c" role="tab" aria-selected="true" data-style="c">クラシック</button>
      <button id="style-j" role="tab" aria-selected="false" data-style="j">ジャズ</button>
    </div>
    <div class="prefs" id="prefs">
    <button class="chip gear" id="gear" aria-expanded="false" aria-controls="settings"><span aria-hidden="true">⚙</span> <span id="gear-label">設定</span></button>
    <div class="settings" id="settings" hidden>
    <div class="srow"><span class="slbl" id="lbl-lang">言語</span>
    <div class="seg lang" role="tablist" aria-label="Language">
      <button id="lang-ja" role="tab" aria-selected="true" data-lang="ja" lang="ja">日本語</button>
      <button id="lang-en" role="tab" aria-selected="false" data-lang="en" lang="en">EN</button>
    </div></div>
    <div class="srow"><span class="slbl" id="lbl-theme">テーマ</span>
    <div class="seg lang" id="theme-seg" role="tablist" aria-label="テーマ">
      <button id="theme-auto" role="tab" aria-selected="true" data-theme-opt="auto">自動</button>
      <button id="theme-light" role="tab" aria-selected="false" data-theme-opt="light">ライト</button>
      <button id="theme-dark" role="tab" aria-selected="false" data-theme-opt="dark">ダーク</button>
    </div></div>
    <div class="srow" id="row-rhythm"><span class="slbl" id="lbl-rhythm">伴奏</span>
    <button class="chip" id="rhythm" aria-pressed="true">リズム隊あり</button></div>
    </div>
    </div>
  </header>

  <div class="bar">
    <div class="chips" id="filters" role="group" aria-label="原則で絞り込む"></div>
    <p class="score" id="score"></p>
  </div>

  <main class="card" id="card">
    <div class="card-head">
      <div class="seg mode" id="mode-seg" role="tablist" aria-label="問題の形式">
        <button id="mode-peak" role="tab" aria-selected="true" data-mode="peak">山はどこ？</button>
        <button id="mode-cmp" role="tab" aria-selected="false" data-mode="cmp">聴き比べ</button>
      </div>
      <span class="count" id="count"></span>
      <div class="nav">
        <button class="btn" id="prev">← 前へ</button>
        <button class="btn next" id="next">次へ →</button>
      </div>
    </div>
    <span class="tag" id="tag"></span>
    <p class="pdesc" id="pdesc"></p>
    <div class="scroller">
      <svg id="staff" aria-label="楽譜"></svg>
      <svg id="curve" aria-label="強弱の曲線" hidden></svg>
      <svg id="curve2" aria-label="強弱の曲線" hidden></svg>
    </div>
    <div class="clegend" id="clegend" hidden></div>
    <p class="prompt" id="prompt"></p>
    <div id="controls"></div>
    <section class="feedback" id="feedback" hidden></section>
  </main>

  <section class="principles" id="principles"><h2 id="pr-title"></h2></section>
  <p class="note-foot" id="foot"></p>
</div>

<script>
/* ================= data ================= */
const PRS = {
 c:{
  1:{name:'弓なり形と終止', desc:'フレーズは中ほどで高まり、終わりで収まる。'},
  2:{name:'跳躍と最高音', desc:'大きな跳躍の到達点や、強拍に来る最高音に重心が来やすい。短い飾りの音は別。'},
  3:{name:'反復とゼクエンツ', desc:'同じ形を繰り返すときは毎回同じにしない。上がるゼクエンツは少しずつ強く、下がるゼクエンツは少しずつ弱く。'},
  4:{name:'フレーズの入れ子', desc:'小さなフレーズにもそれぞれ山があるが、全体の頂点は一つ。部分の山は全体の中で大きさを決める。'},
  5:{name:'倚音と解決', desc:'和音とぶつかる強拍の音（倚音）に重みを置き、解決音で力を抜く。'},
  6:{name:'和声の緊張', desc:'同じ高さの音でも、下の和音の緊張が強いほど重くなる。'},
  7:{name:'弱起', desc:'弱起の音は次の拍頭へ流れ込む。強く弾くと拍がずれて聞こえる。'},
  8:{name:'反復音', desc:'同じ音を並べたままにしない。少しずつ次の音へ向かわせる。'},
  9:{name:'時間の取り方', desc:'頂点への到達や終止で、ほんの少し時間を取る。メトロノーム通りだと機械的になり、頂点で急ぐとせわしなくなる。'},
  10:{name:'スラーのまとまり', desc:'2〜4音ほどの短いスラーでは、頭に重みを置き、終わりは軽く短めに収める。フレーズ全体にかかる長いスラーは、まとまりとレガートを示すもので、この型は当てはまらない。'}
 },
 j:{
  1:{name:'裏拍のアクセント', desc:'8分音符のラインでは、裏拍の音に軽くアクセントを置き、表拍は軽く流す。'},
  2:{name:'線の頂点', desc:'上行して折り返す一番上の音にアクセントを置く。拍の表か裏かには関係しない。'},
  3:{name:'先取り', desc:'拍頭を8分音符ひとつ早く食って入る音にアクセントを置き、タイで伸ばす。'},
  4:{name:'ゴーストノート', desc:'谷になった低い表拍の音を、ほとんど聞こえないくらいに弱く弾く。'},
  5:{name:'短い終わり', desc:'フレーズの最後の音は長く伸ばさず、短く切ってアクセントを付ける。'},
  6:{name:'3連符', desc:'スウィングの中の3連符は均等に弾き、ハネさせない。アクセントは組の頂点か、次の拍へ向かう音に置き、各組の頭を毎回強くしない。'},
  7:{name:'3つずつのフレーズ', desc:'4拍子のまま、8分音符3つずつのまとまりを繰り返す。まとまりの頭に軽いアクセントを置くと、拍とずれた周期が浮かぶ。'},
  8:{name:'ボサノヴァ', desc:'8分音符をハネずに均等に弾く。強弱の幅は小さく、アクセントは控えめにして、レガートで歌う。（聴き比べで練習します）'},
  9:{name:'ダブルタイム', desc:'リズム隊はそのままに、16分音符で倍のテンポのように弾く。ハネとアクセントを1段細かい音価に移す。（聴き比べで練習します）'},
  10:{name:'ビートとの位置', desc:'ビートのどこに乗るか。ミディアムテンポでは表拍をわずかに後ろに置いて裏拍は合わせ（レイドバック）、速いテンポではビートの頭に乗る（オントップ）。休符のあとの入りも、早めず遅らせずに合わせる。（聴き比べで練習します）'},
  11:{name:'ハネの深さ', desc:'ハネの深さはテンポに合わせる。テンポが遅いほど深く3連符に近く、速いほど浅く均等に近づく。（聴き比べで練習します）'}
 }
};

/* ================= parsing ================= */
const LET={C:0,D:1,E:2,F:3,G:4,A:5,B:6}, SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function parse(name){
  const m=/^([A-G])([#b]?)(\d)$/.exec(name);
  const acc=m[2]==='#'?1:m[2]==='b'?-1:0, oct=+m[3];
  return {name,letter:m[1],acc,oct,midi:12*(oct+1)+SEMI[m[1]]+acc,step:LET[m[1]]+7*oct};
}
function prep(ph,style){
  ph.style=style; if(!ph.ts) ph.ts=[4,4]; if(ph.pickup==null) ph.pickup=0;
  let on=0; ph.items=[]; ph.notes=[];
  ph.bars.forEach((bar,bi)=>{ let pos=0; bar.forEach(([n,d,f])=>{
    const base={on,dur:d,bar:bi,pos,flag:f||''};
    if(n==='r'){ ph.items.push(Object.assign(base,{rest:true})); }
    else { const prev=ph.items[ph.items.length-1]; const o=Object.assign(parse(n),base,{idx:ph.notes.length,afterRest:!!(prev&&prev.rest)}); ph.notes.push(o); ph.items.push(o); }
    on+=d; pos+=d; }); });
  ph.total=on;
}
CLASSICAL.forEach(p=>prep(p,'c')); JAZZ.forEach(p=>prep(p,'j'));
JAZZ.sort((a,b)=>a.pr-b.pr||a.id.localeCompare(b.id));
CLASSICAL.sort((a,b)=>a.pr-b.pr||a.id.localeCompare(b.id));

/* ================= classical dynamics ================= */
function shape(ph,peakIdx){
  const N=ph.notes, tp=N[peakIdx].on, te=N[N.length-1].on, num=ph.ts[0];
  const v=N.map(n=>{
    let x;
    if(n.on<=tp){ const f=tp<=0?1:n.on/tp; x=.40+.60*(.5-.5*Math.cos(Math.PI*f)); }
    else { const f=(n.on-tp)/(te-tp); x=1-.66*(.5-.5*Math.cos(Math.PI*f)); }
    const pos=((n.on-ph.pickup)%num+num)%num;
    if(pos===0&&!n.flag) x+=.03;
    return x;
  });
  let run=0;
  N.forEach((n,i)=>{ if(i>0&&n.midi===N[i-1].midi){ run++; v[i]+=.045*run; } else run=0; });
  N.forEach((n,i)=>{ if(n.flag==='a') v[i]+=.10; });
  N.forEach((n,i)=>{ if(n.flag==='r') v[i]=v[i-1]-.30; });
  N.forEach((n,i)=>{ if(n.flag==='p') v[i]=Math.min(v[i],.40); });
  return v.map(x=>Math.max(.16,Math.min(1,x)));
}
function archSegs(ph,segs,heights){
  const N=ph.notes, v=N.map(()=>.4);
  segs.forEach((sg,k)=>{
    const h=heights?heights[k]:sg.h, lo=Math.max(.3,h-.3), endLo=k===segs.length-1?.38:Math.max(.3,h-.25);
    const tp=N[sg.p].on, ts=N[sg.s].on, te=N[sg.e].on;
    for(let i=sg.s;i<=sg.e;i++){ const n=N[i]; let x;
      if(n.on<=tp){ const f=tp<=ts?1:(n.on-ts)/(tp-ts); x=lo+(h-lo)*(.5-.5*Math.cos(Math.PI*f)); }
      else { const f=(n.on-tp)/((te-tp)||1); x=h-(h-endLo)*(.5-.5*Math.cos(Math.PI*f)); }
      v[i]=x; }
  });
  return v;
}
function versionC(ph,d){
  const N=ph.notes, t=d&&d.t;
  const model=ph.segs?archSegs(ph,ph.segs):shape(ph,ph.peak);
  let v;
  if(!d||['inTempo','rushPeak','slurEnd','noGroup'].includes(t)) v=model.slice();
  else if(t==='segs') v=archSegs(ph,ph.segs,d.h);
  else if(t==='flat') v=N.map(()=>.62);
  else if(t==='end') v=shape(ph,N.length-1);
  else if(t==='peakAt') v=shape(ph,d.at);
  else if(t==='resLoud'){ v=model.slice(); N.forEach((n,i)=>{ if(n.flag==='r'){ v[i]=Math.min(1,model[i-1]+.08); v[i-1]=model[i-1]-.22; } }); }
  else if(t==='pickupAccent'){ v=model.slice(); let first=-1; N.forEach((n,i)=>{ if(n.flag==='p') v[i]=.98; else if(first<0) first=i; }); if(first>=0) v[first]*=.62; }
  else v=model.slice();
  if(ph.slurs&&t!=='flat'&&t!=='noGroup'){
    if(t==='slurEnd') ph.slurs.forEach(([a,b,L])=>{ if(!L){ v[a]-=.08; v[b]+=.18; } });
    else ph.slurs.forEach(([a,b,L])=>{ if(!L){ v[a]+=.08; v[b]-=.12; } });
  }
  return v.map(x=>Math.max(.16,Math.min(1,x)));
}
function lenC(ph,d){
  const N=ph.notes, len=N.map(()=>.97);
  if(ph.slurs&&!(d&&(d.t==='noGroup'||d.t==='flat'))) ph.slurs.forEach(([a,b,L])=>{ if(!L&&b<N.length-1) len[b]=.66; });
  return len;
}
function tmC(ph,d){
  const t=d&&d.t;
  if(t==='inTempo') return {amp:0,rit:0};
  if(t==='rushPeak') return {amp:-.16,rit:.24};
  return {amp:ph.timing?.22:0,rit:.24};
}
/* ================= jazz articulation ================= */
const isOff=n=>Math.abs((n.on%1)-.5)<1e-6;
const swingR=bpm=>Math.max(.53,Math.min(.68,.68-(bpm-110)*.0012));
function jart(ph,d){
  const N=ph.notes, L=N.length-1, t=d&&d.t;
  const v=[], len=[];
  N.forEach((n,i)=>{
    const f=n.flag; let a=.56;
    if(n.dur===.5&&!isOff(n)) a=.5;
    if(f.includes('o')) a=.74;
    if(f.includes('A')) a=.97;
    if(f.includes('g')) a=.2;
    v[i]=a; len[i]=f.includes('s')?'short':.92;
  });
  if(t==='classical'){ N.forEach((n,i)=>{ v[i]=isOff(n)?.46:(n.pos%2===0?.84:.72); len[i]=.96; }); v[L]=.5; len[L]='long'; }
  if(t==='flat'){ N.forEach((n,i)=>{ v[i]=.62; len[i]=.92; }); }
  if(t==='longEnd'){ v[L]=.48; len[L]='long'; }
  if(t==='noGhost'){ N.forEach((n,i)=>{ if(n.flag.includes('g')) v[i]=.56; }); }
  if(t==='noPeak'){ N.forEach((n,i)=>{ if(i<L&&n.flag.includes('A')) v[i]=isOff(n)?.7:.56; }); }
  N.forEach((n,i)=>{ if(n.flag.includes('c')) v[i]=v[i-1]; });
  if(t==='beatAcc'||t==='offAcc'){ N.forEach((n,i)=>{ if(i===L) return; const off=isOff(n); v[i]=(t==='beatAcc'?!off:off)?.9:.5; }); }
  if(t==='tripHeads'){ N.forEach((n,i)=>{ if(n.flag.includes('T')){ const head=Math.abs((n.on%1))<1e-6; v[i]=head?.97:.45; } }); }
  if(ph.feel==='bossa'){
    if(t==='punchy'){ N.forEach((n,i)=>{ if(n.flag.includes('o')) v[i]=.9; if(i<L) len[i]=.5; }); }
    else if(t!=='swingBossa'){ N.forEach((n,i)=>{ v[i]=.55+(v[i]-.55)*.35; len[i]=.96; }); }
    else { N.forEach((n,i)=>{ if(isOff(n)) v[i]=Math.max(v[i],.8); }); }
  }
  const base=ph.swing??swingR(ph.bpm);
  let r=t==='straight'?.5:t==='overSwing'?.75:t==='underSwing'?.58:base;
  let rBand=r;
  if(ph.feel==='bossa'){ rBand=.5; r=t==='swingBossa'?.64:.5; }
  let r16=null, dt8=false;

function whyJ(ph,i,kind){
  const n=ph.notes[i], N=ph.notes, maxM=Math.max(...N.map(x=>x.midi));
  const W=U().wj;
  if(kind==='missA'){
    if(i===N.length-1) return W.last;
    if(n.flag.includes('t')) return W.tie;
    if(n.midi===maxM) return W.top;
    if(isOff(n)) return W.off;
    return W.acc;
  }
  if(kind==='missG') return W.missG;
  if(kind==='missS') return W.missS;
  if(kind==='extraS') return W.extraS;
  if(kind==='extraA'){ if(n.flag.includes('g')) return W.xG; return isOff(n)?W.xOff:W.xOn; }
  if(kind==='extraG') return n.flag.includes('A')?W.gA:W.gNo;
  return '';
}

  html+=`<div class="legend"><span><b>&gt;</b>${lg[0]}</span><span><b style="opacity:.45">&gt;</b>${lg[1]}</span><span><b>( )</b>${lg[2]}</span><span><b>・</b>${lg[3]}</span><span>${lg[4]}</span></div>`;
  fb.innerHTML=html;

}

function timingSeries(ph){
  const clip=x=>Math.max(0,Math.min(1,x));
  if(ph.style==='c'&&ph.timing) return d=>{ const tm=tmC(ph,d), spb=60/ph.bpm; return ph.notes.map(n=>clip(.5+((secC(ph,n.on+n.dur,tm)-secC(ph,n.on,tm))/(n.dur*spb)-1)*2)); };
  if(ph.style==='j'&&ph.timeFeel) return d=>{ const a=jart(ph,d), T=noteT(ph,a), spb=60/ph.bpm; const sc=240; return ph.notes.map(n=>{ const off=(isOff(n)?a.offOff:a.offOn)+(n.afterRest?a.entryOff||0:0); const dev=ph.chartRef==='ride'?off:(T(n.on,n)-n.on*spb+off); return clip(.5+dev*1000/sc); }); };
  return null;
}
function timingGrid(ph){
  if(ph.style==='c') return LANG==='en'?[[1,'Broader'],[.5,'In time'],[0,'Hurried']]:[[1,'ゆったり'],[.5,'インテンポ'],[0,'急ぐ']];
  if(ph.chartRef==='ride') return LANG==='en'?[[1,'Behind'],[.5,'With ride'],[0,'Ahead']]:[[1,'後ろ'],[.5,'ライドと同時'],[0,'前']];
  return LANG==='en'?[[1,'Late'],[.5,'As written'],[0,'Early']]:[[1,'遅い'],[.5,'記譜通り'],[0,'早い']];
}
function answerCmp(k){
  if(S.answered) return;
  const ph=cur(); S.answered=true;
  const D=distsAll()[ph.style];
  const mi=S.order.indexOf(null), ok=k===mi, sc=S.score[ph.style+'-cmp'];
  sc[1]++; if(ok) sc[0]++; updScore();
  $('controls').classList.add('answered');
  S.order.forEach((d,j)=>{
    const o=$('opt'+j); o.querySelector('.pick').disabled=true;
    if(j===mi) o.classList.add('model'); else if(j===k) o.classList.add('picked');
    o.querySelector('.what').textContent=d?D[d.k||d.t].name:U().model;
  });
  if(ph.style==='j'){ $('gmarks').innerHTML=''; drawMarks(ph,modelMarks(ph),false); }
  const tv=timingSeries(ph);
  const dashes=[];{ let n=0; S.order.forEach((d,j)=>dashes[j]=d?['7 4','2 3'][n++]:''); }
  const mk=f=>S.order.map((d,j)=>({v:f(d),color:colorFor(j),label:'ABC'[j],dash:dashes[j]}));
  const s1=mk(d=>tv?tv(d):version(ph,d)); drawCurves(ph,s1,tv?{grid:timingGrid(ph)}:null);
  let s2=null; if(tv&&ph.dual){ s2=mk(d=>version(ph,d)); drawCurves(ph,s2,{target:'curve2'}); }
  { const same=(a,b)=>a.v.every((x,i)=>Math.abs(x-b.v[i])<.01);
    const overlap=[s1,s2].filter(Boolean).some(ss=>ss.some((x,j)=>j!==mi&&same(x,ss[mi])));
    const lg=$('clegend'); lg.hidden=false;
    lg.innerHTML=S.order.map((d,j)=>`<span><svg width="30" height="8" aria-hidden="true"><line x1="1" y1="4" x2="29" y2="4" stroke="${colorFor(j)}" stroke-width="${d?2.4:4}" stroke-opacity="${d?1:.55}" stroke-dasharray="${dashes[j]}"/></svg><b>${'ABC'[j]}</b>${d?D[d.k||d.t].name:U().model}</span>`).join('')
      +(overlap&&s2?`<span class="note">${U().overlapNote}</span>`:''); }
  const fb=$('feedback'); fb.hidden=false;
  let html=ok?`<p class="verdict good">${U().cmpOk('ABC'[k])}</p>`:`<p class="verdict bad">${U().cmpBad('ABC'[mi])}</p>`;
  html+=`<p>${whyOf(ph)}</p><ul class="vlist">`;
  S.order.forEach((d,j)=>{ if(d) html+=`<li><span class="k" style="color:${colorFor(j)}">${'ABC'[j]}</span><span><b>${D[d.k||d.t].name}</b>　${d.t==='peakAt'?dwOf(ph,d):D[d.k||d.t].text}</span><span></span></li>`; });
  html+='</ul>';
  fb.innerHTML=html;
  const js=S.order.map((d,jj)=>d?jj:-1).filter(x=>x>=0);
  fb.querySelectorAll('.vlist li').forEach((li,n)=>{ const j=js[n]; li.lastChild.appendChild(btn(U().listen,()=>play(ph,S.order[j]),'',true)); });
  const row=document.createElement('div'); row.className='controls';
  row.appendChild(btn(U().again('ABC'[mi]),()=>play(ph,null),'primary',true));
  row.appendChild(btn(U().retry,()=>load(),'')); fb.appendChild(row);
}

document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
  const id=S.list.length?cur().id:null; S.mode=b.dataset.mode; refreshList();
  const k=S.list.findIndex(i=>set()[i].id===id); S.pos=k>=0?k:0; buildStatic(); load();
});
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{
  if(S.style===b.dataset.style) return;
  S.style=b.dataset.style; S.filter=0; S.pos=0; refreshList(); buildStatic(); load();
  try{ localStorage.setItem('yokuyo-style',S.style); }catch(e){}
});
$('rhythm').onclick=()=>{ S.rhythm=!S.rhythm; $('rhythm').setAttribute('aria-pressed',S.rhythm); $('rhythm').textContent=S.rhythm?U().rhythmOn:U().rhythmOff; };
$('gear').onclick=e=>{ e.stopPropagation(); const open=$('settings').hidden; $('settings').hidden=!open; $('gear').setAttribute('aria-expanded',open); };
document.addEventListener('click',e=>{ if(!$('settings').hidden&&!$('prefs').contains(e.target)){ $('settings').hidden=true; $('gear').setAttribute('aria-expanded','false'); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('settings').hidden){ $('settings').hidden=true; $('gear').setAttribute('aria-expanded','false'); $('gear').focus(); } });
$('prev').onclick=()=>{ if(S.pos>0){ S.pos--; load(); } else if(prOrder().indexOf(S.filter)>0) stepPr(-1); };
$('next').onclick=()=>{ if(S.pos<S.list.length-1){ S.pos++; load(); } else stepPr(1); };

try{ const st=localStorage.getItem('yokuyo-style'); if(st==='j'||st==='c') S.style=st; }catch(e){}
const cap=s=>LANG==='en'?s.charAt(0).toUpperCase()+s.slice(1):s;
var THEME='auto';
const HOST_THEME=document.documentElement.getAttribute('data-theme');
function applyTheme(){
  const r=document.documentElement;
  if(THEME==='auto'){ if(HOST_THEME) r.setAttribute('data-theme',HOST_THEME); else r.removeAttribute('data-theme'); }
  else r.setAttribute('data-theme',THEME);
}
try{ const t=localStorage.getItem('phrasing-theme'); if(t==='light'||t==='dark'||t==='auto') THEME=t; }catch(e){}
applyTheme();
document.querySelectorAll('[data-theme-opt]').forEach(b=>b.onclick=()=>{
  THEME=b.dataset.themeOpt; applyTheme();
  try{ localStorage.setItem('phrasing-theme',THEME); }catch(e){}
  document.querySelectorAll('[data-theme-opt]').forEach(x=>x.setAttribute('aria-selected',x.dataset.themeOpt===THEME));
});
(function(){
  let l=null; try{ l=localStorage.getItem('phrasing-lang'); }catch(e){}
  if(l!=='ja'&&l!=='en'){ const langs=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'ja']; l=/^ja\b/i.test(langs[0]||'')?'ja':'en'; }
  LANG=l;
})();
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{
  if(LANG===b.dataset.lang) return; LANG=b.dataset.lang;
  try{ localStorage.setItem('phrasing-lang',LANG); }catch(e){}
  buildStatic(); load();
});
refreshList(); buildStatic(); load();
</script>
