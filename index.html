<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="クラシックの抑揚とジャズのアーティキュレーションを練習するドリル / A drill for classical phrasing and jazz articulation.">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>フレージング道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Music&display=swap">
<style>
/* Layout: one centered practice column — score sheet card on top, principle index below. */
:root{
  --bg:#EEF0F4; --panel:#FFFFFF; --ink:#1B2130; --muted:#5B6274; --line:#D6DAE3;
  --accent:#3646A3; --accent-soft:#E2E5F6; --good:#24795A; --good-soft:#DFF1E8;
  --warn:#A9562A; --warn-soft:#F7E7DD; --c2:#B0602A; --c3:#25817F;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-music:"Noto Music","Bravura","Segoe UI Symbol","Apple Symbols",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11141B; --panel:#1A1E28; --ink:#E5E8EF; --muted:#9AA1B3; --line:#2E3443;
  --accent:#9AA6FF; --accent-soft:#272D4C; --good:#62C796; --good-soft:#1D3329;
  --warn:#E89C6A; --warn-soft:#3A2A20; --c2:#E39A63; --c3:#5CC6C2; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11141B; --panel:#1A1E28; --ink:#E5E8EF; --muted:#9AA1B3; --line:#2E3443;
  --accent:#9AA6FF; --accent-soft:#272D4C; --good:#62C796; --good-soft:#1D3329;
  --warn:#E89C6A; --warn-soft:#3A2A20; --c2:#E39A63; --c3:#5CC6C2; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:1.9rem;margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:.92rem}
.score{margin-left:auto;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;padding:6px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--panel)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:.82rem;padding:4px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.tag{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.tag small{font-family:var(--f-body);font-weight:500;font-size:.78rem;letter-spacing:.08em;color:var(--accent);margin-right:8px}
.count{margin-left:auto;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.pdesc{margin:-6px 0 0;color:var(--muted);font-size:.9rem}

.scroller{overflow-x:auto;margin:0 -6px;padding:0 6px}
.scroller svg{display:block;width:100%;min-width:520px;height:auto}
.staff-line,.bar-line,.ledger{stroke:var(--ink);stroke-width:1}
.staff-line{opacity:.55}
.bar-line.end{stroke-width:3}
.glyph{fill:var(--ink)}
.chord{fill:var(--muted);font-family:var(--f-body);font-size:11px;font-weight:700}
.note .head{fill:var(--ink);stroke:var(--ink);stroke-width:1.5}
.note .head.hollow{fill:var(--panel)}
.note .stem,.note .flag{stroke:var(--ink);stroke-width:1.3;fill:none}
.note .dot,.note .acc{fill:var(--ink)}
.note .hit{fill:transparent;cursor:pointer}
.note .ring{fill:none;stroke:transparent;stroke-width:2}
.pickable .note:hover .head{fill:var(--accent);stroke:var(--accent)}
.pickable .note:hover .head.hollow{fill:var(--accent-soft)}
.note.sounding .head{fill:var(--accent);stroke:var(--accent)}
.note.sounding .head.hollow{fill:var(--accent-soft)}
.note.chosen .head{fill:var(--warn);stroke:var(--warn)}
.note.chosen .head.hollow{fill:var(--warn-soft)}
.note.chosen.right .head{fill:var(--good);stroke:var(--good)}
.note.chosen.right .head.hollow{fill:var(--good-soft)}
.note.best .ring{stroke:var(--good)}
.note.alt .ring{stroke:var(--good);stroke-dasharray:3 3}

.curve-grid{stroke:var(--line);stroke-width:1}
.curve-label{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.curve-line{fill:none;stroke-width:2.2;stroke-linejoin:round}
.curve-dot{stroke:var(--panel);stroke-width:1.5}

.prompt{margin:0;font-size:.95rem}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:.9rem;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn .tri{width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:0}
.opt .lbl{font-family:var(--f-display);font-weight:800;font-size:1.4rem;line-height:1;display:flex;align-items:center;gap:8px}
.opt .sw{width:18px;height:4px;border-radius:2px;display:none}
.answered .opt .sw{display:inline-block}
.opt.picked{border-color:var(--warn)}
.opt.model{border-color:var(--good);background:var(--good-soft)}
.opt .what{font-size:.82rem;color:var(--muted);min-height:1.2em}

.feedback{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin:0}
.verdict.good{color:var(--good)} .verdict.mid{color:var(--accent)} .verdict.bad{color:var(--warn)}
.feedback p{margin:0;max-width:65ch}
.feedback .hint{color:var(--muted)}
.vlist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.vlist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border-radius:9px;background:var(--bg)}
.vlist .k{font-family:var(--f-display);font-weight:800}
.vlist b{font-weight:700}
.nav{display:flex;gap:6px}
.nav .btn{padding:6px 12px;font-size:.85rem}
.nav .btn.next{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.principles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;padding:4px 2px}
.principles h2{grid-column:1/-1;font-family:var(--f-display);font-size:1.05rem;margin:0}
.pr{display:grid;grid-template-columns:2em minmax(0,1fr);gap:4px;font-size:.88rem}
.pr .n{font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:1.1rem;line-height:1.5}
.pr b{display:block}
.pr span{color:var(--muted)}
.note-foot{font-size:.82rem;color:var(--muted);margin:0;max-width:70ch}
@media (max-width:620px){
  .opts{grid-template-columns:minmax(0,1fr)}
  .opt{flex-direction:row;flex-wrap:wrap;align-items:center}
  .opt .what{flex-basis:100%}
  .principles{grid-template-columns:minmax(0,1fr)}
  .card{padding:16px 14px}
  .score{margin-left:0;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
svg[hidden]{display:none}
.seg.lang{padding:2px}
.seg.lang button{padding:4px 11px;font-size:.8rem}
.seg.style button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
.toggle{margin-left:auto}
.beam{fill:var(--ink)}
.rest{fill:var(--ink);stroke:var(--ink)}
.rest-q{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.tie{fill:none;stroke:var(--ink);stroke-width:1.4}
.mark{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mark.light{opacity:.4}
.mark.user{stroke:var(--accent)}
.paren{fill:var(--ink);font-size:15px;font-family:Georgia,serif}
.paren.user{fill:var(--accent)}
.sdot{fill:var(--ink)}
.note.sel-a .head,.note.sel-g .head{fill:var(--accent);stroke:var(--accent)}
.note.sel-g .head{opacity:.55}
.note.missed .ring{stroke:var(--good)}
.note.extra .head{fill:var(--warn);stroke:var(--warn)}
.note.hit .head{fill:var(--good);stroke:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}
.legend b{color:var(--ink);font-family:Georgia,serif;font-weight:700;margin-right:3px}
.tally{display:flex;flex-wrap:wrap;gap:8px}
.tally span{font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--bg);font-variant-numeric:tabular-nums}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="h1">フレージング道場</h1>
    <p class="sub" id="sub">解釈編｜旋律のどこに重みを置くか</p>
    <p class="score" id="score"></p>
    <div class="seg lang" role="tablist" aria-label="Language">
      <button id="lang-ja" role="tab" aria-selected="true" data-lang="ja" lang="ja">日本語</button>
      <button id="lang-en" role="tab" aria-selected="false" data-lang="en" lang="en">EN</button>
    </div>
    <div class="seg lang" id="theme-seg" role="tablist" aria-label="テーマ">
      <button id="theme-auto" role="tab" aria-selected="true" data-theme-opt="auto">自動</button>
      <button id="theme-light" role="tab" aria-selected="false" data-theme-opt="light">ライト</button>
      <button id="theme-dark" role="tab" aria-selected="false" data-theme-opt="dark">ダーク</button>
    </div>
  </header>

  <div class="bar">
    <div class="seg style" role="tablist" aria-label="スタイル">
      <button id="style-c" role="tab" aria-selected="true" data-style="c">クラシック</button>
      <button id="style-j" role="tab" aria-selected="false" data-style="j">ジャズ</button>
    </div>
    <div class="seg" role="tablist" aria-label="問題の形式">
      <button id="mode-peak" role="tab" aria-selected="true" data-mode="peak">山はどこ？</button>
      <button id="mode-cmp" role="tab" aria-selected="false" data-mode="cmp">聴き比べ</button>
    </div>
    <button class="chip toggle" id="rhythm" aria-pressed="true" hidden>リズム隊あり</button>
  </div>
  <div class="chips" id="filters" aria-label="原則で絞り込む"></div>

  <main class="card" id="card">
    <div class="card-head">
      <span class="tag" id="tag"></span>
      <span class="count" id="count"></span>
      <div class="nav">
        <button class="btn" id="prev">← 前へ</button>
        <button class="btn next" id="next">次へ →</button>
      </div>
    </div>
    <p class="pdesc" id="pdesc"></p>
    <div class="scroller">
      <svg id="staff" aria-label="楽譜"></svg>
      <svg id="curve" aria-label="強弱の曲線" hidden></svg>
    </div>
    <p class="prompt" id="prompt"></p>
    <div id="controls"></div>
    <section class="feedback" id="feedback" hidden></section>
  </main>

  <section class="principles" id="principles"><h2 id="pr-title"></h2></section>
  <p class="note-foot" id="foot"></p>
</div>

<script>
/* ================= data ================= */
const PRS = {
 c:{
  1:{name:'弓なり形と終止', desc:'フレーズは中ほどで高まり、終わりで収まる。'},
  2:{name:'跳躍と最高音', desc:'大きな跳躍の到達点や、強拍に来る最高音に重心が来やすい。短い飾りの音は別。'},
  3:{name:'倚音と解決', desc:'和音とぶつかる強拍の音（倚音）に重みを置き、解決音で力を抜く。'},
  4:{name:'和声の緊張', desc:'同じ高さの音でも、下の和音の緊張が強いほど重くなる。'},
  5:{name:'弱起', desc:'弱起の音は次の拍頭へ流れ込む。強く弾くと拍がずれて聞こえる。'},
  6:{name:'反復音', desc:'同じ音を並べたままにしない。少しずつ次の音へ向かわせる。'}
 },
 j:{
  1:{name:'裏拍のアクセント', desc:'8分音符のラインでは、裏拍の音に軽くアクセントを置き、表拍は軽く流す。'},
  2:{name:'線の頂点', desc:'上行して折り返す一番上の音にアクセントを置く。拍の表か裏かには関係しない。'},
  3:{name:'先取り', desc:'拍頭を8分音符ひとつ早く食って入る音にアクセントを置き、タイで伸ばす。'},
  4:{name:'ゴーストノート', desc:'谷になった低い表拍の音を、ほとんど聞こえないくらいに弱く弾く。'},
  5:{name:'短い終わり', desc:'フレーズの最後の音は長く伸ばさず、短く切ってアクセントを付ける。'}
 }
};
const TEXT = {
 c:{sub:'解釈編｜旋律のどこに重みを置くか', modeA:'山はどこ？', prTitle:'6つの原則',
    foot:'模範の抑揚は「筋の通った読み方の一例」です。点線の丸は別解として成り立つ音を示します。違う答えを選んだときは、その理由を自分の言葉で説明できるかを考えてみてください。'},
 j:{sub:'ジャズ編｜スウィングの8分音符をどう弾き分けるか', modeA:'アクセントはどこ？', prTitle:'5つの原則（スウィング）',
    foot:'ジャズのアーティキュレーションは奏者やスタイルで大きく変わります。ここで扱うのはスウィングやビバップの8分音符ラインの基本的な型です。薄い「>」は、付けても付けなくてもよい軽い持ち上げを表し、採点には含めません。'}
};

/* ================= i18n ================= */
let LANG='ja';
const PRS_EN = {
 c:{
  1:{name:'Arch and cadence', desc:'A phrase swells toward the middle and settles at the end.'},
  2:{name:'Leaps and high notes', desc:'The landing note of a big leap, or a high note on a strong beat, tends to carry the weight. Short ornaments are the exception.'},
  3:{name:'Appoggiatura and resolution', desc:'Lean on the dissonant note on the strong beat (the appoggiatura) and relax on its resolution.'},
  4:{name:'Harmonic tension', desc:'The same pitch weighs more when the harmony underneath is more tense.'},
  5:{name:'Upbeats', desc:'An upbeat flows into the next downbeat. Played strongly, it makes the meter sound shifted.'},
  6:{name:'Repeated notes', desc:"Don't leave repeated notes flat. Let each one lean toward the next."}
 },
 j:{
  1:{name:'Offbeat accents', desc:'In a line of eighth notes, give the offbeats a light accent and let the downbeats pass lightly.'},
  2:{name:'Top of the line', desc:'Accent the highest note where the line turns around, whether it falls on or off the beat.'},
  3:{name:'Anticipation', desc:'Accent a note that arrives an eighth early, ahead of the beat, and tie it over.'},
  4:{name:'Ghost notes', desc:'Play a low downbeat note at the bottom of a dip so softly it is barely heard.'},
  5:{name:'Short endings', desc:"Don't hold the last note of a phrase. Cut it short and accent it."}
 }
};
const TEXT_EN = {
 c:{sub:'Interpretation | Where does the melody lean?', modeA:'Find the peak', prTitle:'Six principles',
    foot:'The model shaping is one well-reasoned reading, not the only answer. A dashed circle marks another note that also works as the peak. When your answer differs, ask yourself whether you can explain your reasons in your own words.'},
 j:{sub:'Jazz | Shaping swing eighth notes', modeA:'Find the accents', prTitle:'Five principles (swing)',
    foot:'Jazz articulation varies a lot between players and styles. This covers the basic patterns of swing and bebop eighth-note lines. A faint ">" marks an optional light lift on an offbeat and is not scored.'}
};
const DISTS_EN = {
 c:{
  flat:{name:'Flat',text:'Every note is played at the same level. The line never seems to be going anywhere; the notes are just lined up.'},
  end:{name:'Peak at the cadence',text:'It grows toward the final note. The cadence never settles, so the phrase sounds thrown away instead of closed.'},
  resLoud:{name:'Loud resolution',text:'The resolution is louder than the appoggiatura. Tension and release come in the wrong order, and the clash loses its meaning.'},
  pickupAccent:{name:'Heavy upbeat',text:'The upbeat is played strongly and the next downbeat weakly. The meter shifts, and the upbeat sounds like a downbeat.'},
  peakAt:{name:'Peak in the wrong place',text:''}
 },
 j:{
  classical:{name:'Downbeat accents',text:'Classical style: the downbeats are heavy and the last note is held long. Even over a swing groove, downbeat accents make the line drag.'},
  flat:{name:'Flat',text:'Every note is connected at the same level. It swings, but nothing stands out.'},
  straight:{name:'Even eighths',text:'The accents are where the model has them, but the eighths are even (not swung), so the offbeat accents sound rushed.'},
  noPeak:{name:'Key accents missing',text:'The offbeats get a light lift, but the notes that matter most (the top of the line or the anticipation) get no accent. The highlight of the line gets lost.'},
  noGhost:{name:'No ghost notes',text:'The low notes in the dips are as loud as everything else. They cut into the upper line and blur the shape of the melody.'},
  longEnd:{name:'Long ending',text:'The last note is held and faded out. That is the classical way to end, and it loses the crisp jazz cutoff.'}
 }
};
const EN = {
 '1-1':{why:'A4 is the highest note and sits in the middle of the phrase. The stepwise climb reaches its top here, and the second half descends to settle on the tonic C4.',
   alt:{4:'G4 is a long note at the start of the bar and has weight of its own. Hearing the peak begin here and reach its summit on A4 keeps the line flowing.'}},
 '1-2':{why:'E5 is the highest note and lands on beat 1 of bar 2, the strong beat. It is the goal of the arpeggio climb. From there the line steps down to a half cadence on G4. G4 is not the tonic, so settle without closing completely.',
   dw:{2:'C5 is still on the way up. Peaking here means the line is already falling by the time it reaches E5, and the arrival loses its point.'}},
 '2-1':{why:'There is a leap of a sixth from C4 to A4. A leap is the most energetic move in a melody, and the note it lands on naturally becomes the peak. It is also a long note at the start of the bar and the highest note.',
   dw:{1:'E4 is a small opening gesture. A peak here weakens the big leap that follows.'}},
 '2-2':{why:'The leap of a sixth from E4 to C5 is the backbone of this phrase. The highest note is D5, but it is an eighth-note neighbor tone (an ornament) on a weak beat and passes lightly. Even the highest note rarely becomes the peak when it is a short ornament.',
   dw:{4:'Making the eighth-note D5 the peak lets an ornament stick out and blurs the backbone of the melody (the E4 → C5 leap).'}},
 '3-1':{why:'C5 at the start of bar 2 is a non-chord tone (an appoggiatura) over V (G–B–D). It clashes with B and creates tension, then resolves to B4. This moment of dissonance weighs more than the high E5, and the resolution B4 relaxes.',
   alt:{3:'E5 is the highest note. You can also make it the peak and show the appoggiatura in bar 2 through weight instead (a little softer, but still stronger than its resolution).'}},
 '3-2':{why:'F5 is an appoggiatura over V (E–G♯–B), a strong half-step clash with E. It is also a long note at the start of the bar. A5 just before it is the highest note, but as part of a tonic arpeggio it sounds stable. The peak of tension is F5, which relaxes as it resolves to E5.',
   alt:{2:'A5 is the highest note and the landing point of a leap. You can also make it the peak and let F5 be carried by its harmonic weight.'}},
 '4-1':{why:'C5 at the start of bar 3 is the same pitch as before, but the harmony changes to the secondary dominant (V⁷/V: D–F♯–A–C). C5 becomes the seventh and forms a tritone with F♯. The same pitch changes weight with the harmony.',
   alt:{3:'The C5 just before it is also the highest note. Growing from there and reaching the summit with the change of harmony is also natural.'}},
 '4-2':{why:'The melody stays on C5, but the harmony moves I → IV → II⁷ → V⁷/V, and the tension builds step by step. The peak is the V⁷/V, where F♯ enters. From there it resolves to V (B4) and then to I.',
   alt:{2:'Over II⁷, C5 is also a seventh and carries tension. Think of the peak starting here and growing further with the next chord.'},
   dw:{0:'The C5 in bar 1 sits over the tonic chord, the most stable sound. A peak here runs against the rising harmonic tension.'}},
 '5-1':{why:'F5 is the highest note and falls on the strong beat of bar 2. The opening G4 is an upbeat (anacrusis) that flows into C5 at the start of the next bar. Don\'t play the upbeat strongly; come in lightly toward the downbeat.'},

/* ================= parsing ================= */
const LET={C:0,D:1,E:2,F:3,G:4,A:5,B:6}, SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function parse(name){
  const m=/^([A-G])([#b]?)(\d)$/.exec(name);
  const acc=m[2]==='#'?1:m[2]==='b'?-1:0, oct=+m[3];
  return {name,letter:m[1],acc,oct,midi:12*(oct+1)+SEMI[m[1]]+acc,step:LET[m[1]]+7*oct};
}
function prep(ph,style){
  ph.style=style; if(!ph.ts) ph.ts=[4,4]; if(ph.pickup==null) ph.pickup=0;
  let on=0; ph.items=[]; ph.notes=[];
  ph.bars.forEach((bar,bi)=>{ let pos=0; bar.forEach(([n,d,f])=>{
    const base={on,dur:d,bar:bi,pos,flag:f||''};
    if(n==='r'){ ph.items.push(Object.assign(base,{rest:true})); }
    else { const o=Object.assign(parse(n),base,{idx:ph.notes.length}); ph.notes.push(o); ph.items.push(o); }
    on+=d; pos+=d; }); });
  ph.total=on;
}
CLASSICAL.forEach(p=>prep(p,'c')); JAZZ.forEach(p=>prep(p,'j'));
const SETS={c:CLASSICAL,j:JAZZ};

/* ================= classical dynamics ================= */
function shape(ph,peakIdx){
  const N=ph.notes, tp=N[peakIdx].on, te=N[N.length-1].on, num=ph.ts[0];
  const v=N.map(n=>{
    let x;
    if(n.on<=tp){ const f=tp<=0?1:n.on/tp; x=.40+.60*(.5-.5*Math.cos(Math.PI*f)); }
    else { const f=(n.on-tp)/(te-tp); x=1-.66*(.5-.5*Math.cos(Math.PI*f)); }
    const pos=((n.on-ph.pickup)%num+num)%num;
    if(pos===0&&!n.flag) x+=.03;
    return x;
  });
  let run=0;
  N.forEach((n,i)=>{ if(i>0&&n.midi===N[i-1].midi){ run++; v[i]+=.045*run; } else run=0; });
  N.forEach((n,i)=>{ if(n.flag==='a') v[i]+=.10; });
  N.forEach((n,i)=>{ if(n.flag==='r') v[i]=v[i-1]-.30; });
  N.forEach((n,i)=>{ if(n.flag==='p') v[i]=Math.min(v[i],.40); });
  return v.map(x=>Math.max(.16,Math.min(1,x)));
}
function versionC(ph,d){
  const N=ph.notes, model=shape(ph,ph.peak);
  if(!d) return model;
  if(d.t==='flat') return N.map(()=>.62);
  if(d.t==='end') return shape(ph,N.length-1);
  if(d.t==='peakAt') return shape(ph,d.at);
  if(d.t==='resLoud'){ const v=model.slice(); N.forEach((n,i)=>{ if(n.flag==='r'){ v[i]=Math.min(1,model[i-1]+.08); v[i-1]=model[i-1]-.22; } }); return v; }
  if(d.t==='pickupAccent'){ const v=model.slice(); let first=-1; N.forEach((n,i)=>{ if(n.flag==='p') v[i]=.98; else if(first<0) first=i; }); if(first>=0) v[first]*=.62; return v; }
  return model;
}

/* ================= jazz articulation ================= */
const isOff=n=>Math.abs((n.on%1)-.5)<1e-6;
const swingR=bpm=>Math.max(.53,Math.min(.68,.68-(bpm-110)*.0012));
function jart(ph,d){
  const N=ph.notes, L=N.length-1, t=d&&d.t;
  const v=[], len=[];
  N.forEach((n,i)=>{
    const f=n.flag; let a=.56;
    if(n.dur===.5&&!isOff(n)) a=.5;
    if(f.includes('o')) a=.74;
    if(f.includes('A')) a=.97;
    if(f.includes('g')) a=.2;
    v[i]=a; len[i]=f.includes('s')?'short':.92;
  });
  if(t==='classical'){ N.forEach((n,i)=>{ v[i]=isOff(n)?.46:(n.pos%2===0?.84:.72); len[i]=.96; }); v[L]=.5; len[L]='long'; }
  if(t==='flat'){ N.forEach((n,i)=>{ v[i]=.62; len[i]=.92; }); }
  if(t==='longEnd'){ v[L]=.48; len[L]='long'; }
  if(t==='noGhost'){ N.forEach((n,i)=>{ if(n.flag.includes('g')) v[i]=.56; }); }
  if(t==='noPeak'){ N.forEach((n,i)=>{ if(i<L&&n.flag.includes('A')) v[i]=isOff(n)?.7:.56; }); }
  N.forEach((n,i)=>{ if(n.flag.includes('c')) v[i]=v[i-1]; });
  return {v,len,r:t==='straight'?.5:swingR(ph.bpm)};
}
function artFromSel(ph,sel){
  const a=jart(ph,{t:'flat'});
  ph.notes.forEach((n,i)=>{ if(sel[i]==='A') a.v[i]=.97; if(sel[i]==='g') a.v[i]=.2; if(n.flag.includes('c')) a.v[i]=a.v[i-1]; });
  return a;
}
function version(ph,d){ return ph.style==='j'?jart(ph,d).v:versionC(ph,d); }

/* ================= audio ================= */
let ctx=null, master=null, bus=null, timers=[], noiseBuf=null;
function ensureCtx(){
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-12; comp.ratio.value=2.5;
    master=ctx.createGain(); master.gain.value=.55; master.connect(comp); comp.connect(ctx.destination);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.6,ctx.sampleRate);
    const ch=noiseBuf.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
  }
  if(ctx.state==='suspended') ctx.resume();
}
const PARTIALS=[1,.55,.32,.2,.13,.08,.05];
function piano(dest,midi,t0,dur,v,scale=1){
  const f0=440*Math.pow(2,(midi-69)/12);
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=600+6800*Math.pow(v,1.6); lp.Q.value=.4;
  const out=ctx.createGain(); out.gain.value=Math.pow(10,(-27+27*v)/20)*.22*scale;
  lp.connect(out); out.connect(dest);
  const tau=Math.max(.45,2.4-(midi-48)*.035), tEnd=t0+dur;
  PARTIALS.forEach((a,k)=>{
    const n=k+1, f=n*f0*Math.sqrt(1+.0004*n*n); if(f>12000) return;
    const o=ctx.createOscillator(); o.frequency.value=f;
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(a,t0+.004);
    g.gain.setTargetAtTime(0,t0+.004,tau/(1+.6*k));
    g.gain.setTargetAtTime(0,tEnd,.05);
    o.connect(g); g.connect(lp); o.start(t0); o.stop(tEnd+.6);
  });
}
function bass(dest,midi,t0,dur){
  const f=440*Math.pow(2,(midi-69)/12);
  const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f;
  const o2=ctx.createOscillator(); o2.frequency.value=f;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700;
  const g=ctx.createGain(); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.32,t0+.012);
  g.gain.setTargetAtTime(.14,t0+.012,.12); g.gain.setTargetAtTime(0,t0+dur,.04);
  o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(dest);
  [o,o2].forEach(x=>{ x.start(t0); x.stop(t0+dur+.3); });
}
function cymbal(dest,t0,v,hat){
  const s=ctx.createBufferSource(); s.buffer=noiseBuf;
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=hat?7500:5200;
  const bp=ctx.createBiquadFilter(); bp.type='peaking'; bp.frequency.value=hat?9000:6800; bp.gain.value=8; bp.Q.value=2;
  const g=ctx.createGain(); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+.002);
  g.gain.setTargetAtTime(0,t0+.002,hat?.025:.16);
  s.connect(hp); hp.connect(bp); bp.connect(g); g.connect(dest); s.start(t0); s.stop(t0+.6);
}
function stopAll(){
  if(bus){ const b=bus; try{ b.gain.setTargetAtTime(0,ctx.currentTime,.03); }catch(e){} setTimeout(()=>{ try{b.disconnect();}catch(e){} },400); bus=null; }
  timers.forEach(clearTimeout); timers=[];
  document.querySelectorAll('.note.sounding').forEach(e=>e.classList.remove('sounding'));
}
function highlight(i,ms){
  timers.push(setTimeout(()=>{ document.querySelectorAll('.note.sounding').forEach(x=>x.classList.remove('sounding')); const el=document.getElementById('n'+i); if(el) el.classList.add('sounding'); },ms));
}
function beatToSecC(ph,b){
  const spb=60/ph.bpm, T=ph.total, start=T-2.5; let s=0; const step=.02;
  for(let x=0;x<b-1e-9;x+=step){ const mid=Math.min(x+step/2,b); const r=1+.24*Math.max(0,Math.min(1,(mid-start)/2.5)); s+=Math.min(step,b-x)*spb*r; }
  return s;
}
function playC(ph,dyn){
  ensureCtx(); stopAll(); bus=ctx.createGain(); bus.connect(master);
  const t=ctx.currentTime+.08;
  ph.notes.forEach((n,i)=>{
    const s=beatToSecC(ph,n.on), e=beatToSecC(ph,n.on+n.dur), last=i===ph.notes.length-1;
    piano(bus,n.midi,t+s,(e-s)*.97+(last?.6:0),dyn[i]); highlight(i,(s+.08)*1000);
  });
  (ph.chords||[]).forEach(([b,d,,notes])=>{
    const s=beatToSecC(ph,b), e=beatToSecC(ph,b+d), last=b+d>=ph.total;
    notes.forEach(nm=>piano(bus,parse(nm).midi,t+s,(e-s)*.98+(last?.6:0),.34,.75));
  });
  timers.push(setTimeout(()=>document.querySelectorAll('.note.sounding').forEach(x=>x.classList.remove('sounding')),(beatToSecC(ph,ph.total)+.5)*1000));
}
const QUAL={maj7:[0,4,7,11],m7:[0,3,7,10],'7':[0,4,7,10],'6':[0,4,7,9],m7b5:[0,3,6,10]};
function chordInfo(sym){
  const m=/^([A-G][#b]?)(maj7|m7b5|m7|7|6)$/.exec(sym);
  const root=parse(m[1]+'4').midi%12, iv=QUAL[m[2]];
  return {root,iv};
}
function inRange(pc,lo){ let x=lo+((pc-lo)%12+12)%12; return x; }
function playJ(ph,art){
  ensureCtx(); stopAll(); bus=ctx.createGain(); bus.connect(master);
  const spb=60/ph.bpm, r=art.r;
  const T=b=>{ const k=Math.floor(b+1e-9), f=b-k; return (k+(f<=.5?f/.5*r:r+(f-.5)/.5*(1-r)))*spb; };
  const t=ctx.currentTime+.08, N=ph.notes;
  N.forEach((n,i)=>{
    if(n.flag.includes('c')) return;
    let durB=n.dur; if(n.flag.includes('t')&&N[i+1]) durB+=N[i+1].dur;
    const s=T(n.on), e=T(n.on+durB);
    let len=art.len[i];
    const d = len==='short' ? Math.min(.3*spb,(e-s)*.6) : len==='long' ? (e-s)+spb*1.4 : (e-s)*len;
    piano(bus,n.midi,t+s,d,art.v[i]); highlight(i,(s+.08)*1000);
  });
  if(S.rhythm){
    const bars=Math.ceil(ph.total/4), beats=bars*4;
    for(let k=0;k<beats;k++){
      cymbal(bus,t+T(k),.05,false);
      if(k%2===1){ cymbal(bus,t+T(k+.5),.032,false); cymbal(bus,t+T(k),.03,true); }
    }
    ph.chords.forEach(([b,d,sym],ci)=>{
      const c=chordInfo(sym), rootM=inRange(c.root,36);
      const next=ph.chords[ci+1]; const nRoot=next?inRange(chordInfo(next[2]).root,36):null;
      const pattern=[0,c.iv[1],c.iv[2],c.iv[1]];
      for(let j=0;j<d;j++){
        let m=rootM+pattern[j%4];
        if(j===d-1&&d>1&&nRoot!=null) m = nRoot+(nRoot>rootM+pattern[(j-1)%4]?-1:1);
        bass(bus,m,t+T(b+j),T(b+j+1)-T(b+j)-.02);
      }
      const voicing=[c.iv[1],c.iv[3],14].map(x=>inRange((c.root+x)%12,52));
      const hits=d>=4?[0,1.5]:[0];
      hits.forEach(h=>voicing.forEach(m=>piano(bus,m,t+T(b+h),spb*.45,.32,.55)));
    });
  }
  timers.push(setTimeout(()=>document.querySelectorAll('.note.sounding').forEach(x=>x.classList.remove('sounding')),(T(ph.total)+.4)*1000));
}
function play(ph,d){ if(ph.style==='j') playJ(ph,jart(ph,d)); else playC(ph,versionC(ph,d)); }
function playPlain(ph){ if(ph.style==='j') playJ(ph,jart(ph,{t:'flat'})); else playC(ph,ph.notes.map(()=>.6)); }

const SVGNS='http://www.w3.org/2000/svg';
const GAP=10, TOP=40, BOT=TOP+4*GAP;
const yOf=step=>BOT-(step-30)*GAP/2;
let layout=null;
function el(tag,attrs,parent,text){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(text!=null) e.textContent=text; if(parent) parent.appendChild(e); return e; }
const pretty=s=>s.replace(/b(?=\d|m|7|$)/g,'♭').replace('#','♯');

function drawStaff(ph){
  const svg=document.getElementById('staff'); svg.innerHTML='';
  const xs=[], itemX=[], spans=[]; let x=72; const accMem={}; const bars=[];
  ph.items.forEach((it,k)=>{
    if(k>0&&it.bar!==ph.items[k-1].bar){ bars.push(x+2); x+=18; }
    let showAcc=false;
    if(!it.rest){ const key=it.bar+':'+it.letter+it.oct; const prev=accMem[key]??0; showAcc=it.acc!==prev&&!it.flag.includes('c'); accMem[key]=it.acc; if(showAcc) x+=10; }
    const w=24+15*it.dur;
    itemX.push(x);
    if(!it.rest){ xs[it.idx]=x; spans[it.idx]=[x-(showAcc?20:12),x+w-12]; it.showAcc=showAcc; }
    x+=w;
  });
  const W=x+14, H=128;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  for(let k=0;k<5;k++) el('line',{x1:6,x2:W-4,y1:TOP+k*GAP,y2:TOP+k*GAP,class:'staff-line'},svg);
  el('text',{x:8,y:BOT-GAP,class:'glyph','font-family':'Noto Music, Bravura, Segoe UI Symbol, Apple Symbols, serif','font-size':44},svg,'\u{1D11E}');
  el('text',{x:44,y:TOP+GAP*2-2,class:'glyph','font-size':21,'font-weight':800,'font-family':'Georgia, serif','text-anchor':'middle'},svg,String(ph.ts[0]));
  el('text',{x:44,y:BOT-2,class:'glyph','font-size':21,'font-weight':800,'font-family':'Georgia, serif','text-anchor':'middle'},svg,String(ph.ts[1]));
  bars.forEach(bx=>el('line',{x1:bx,x2:bx,y1:TOP,y2:BOT,class:'bar-line'},svg));
  el('line',{x1:W-9,x2:W-9,y1:TOP,y2:BOT,class:'bar-line'},svg);
  el('line',{x1:W-5,x2:W-5,y1:TOP,y2:BOT,class:'bar-line end'},svg);

  // rests
  ph.items.forEach((it,k)=>{ if(!it.rest) return; const rx=itemX[k];
    if(it.dur===.5){ el('circle',{cx:rx-2,cy:TOP+15,r:2.8,class:'rest'},svg); el('path',{d:`M${rx+3} ${TOP+13} Q${rx} ${TOP+18} ${rx-3} ${TOP+16} M${rx+3} ${TOP+13} L${rx-2} ${TOP+31}`,class:'rest-q','stroke-width':1.6},svg); }
    else if(it.dur===1){ el('path',{d:`M${rx-3} ${TOP+7} L${rx+3} ${TOP+15} L${rx-2} ${TOP+21} L${rx+3} ${TOP+28} Q${rx-5} ${TOP+25} ${rx-1} ${TOP+33}`,class:'rest-q'},svg); }
    else if(it.dur===2){ el('rect',{x:rx-6,y:TOP+2*GAP-5,width:12,height:5,class:'rest'},svg); }
    else { el('rect',{x:rx-6,y:TOP+GAP,width:12,height:5,class:'rest'},svg); }
  });

  // beam groups
  const N=ph.notes, info=[];
  const groups=[]; let g=[];
  const gkey=n=>ph.ts[0]===4?Math.floor(n.pos/2+1e-9):Math.floor(n.pos+1e-9);
  ph.items.forEach(it=>{
    if(!it.rest&&it.dur===.5&&g.length&&N[g[g.length-1]].bar===it.bar&&gkey(N[g[g.length-1]])===gkey(it)&&N[g[g.length-1]].idx===it.idx-1&&ph.items.indexOf(N[g[g.length-1]])===ph.items.indexOf(it)-1) g.push(it.idx);
    else { if(g.length) groups.push(g); g=(!it.rest&&it.dur===.5)?[it.idx]:[]; }
  });
  if(g.length) groups.push(g);
  const inBeam={};
  groups.filter(gr=>gr.length>1).forEach(gr=>{
    const avg=gr.reduce((s,i)=>s+N[i].step,0)/gr.length, up=avg<34;
    const sx=gr.map(i=>xs[i]+(up?5:-5)), ny=gr.map(i=>yOf(N[i].step));
    let y1=ny[0]+(up?-32:32), y2=ny[ny.length-1]+(up?-32:32);
    let slope=Math.max(-8,Math.min(8,y2-y1)); y2=y1+slope;
    const by=j=>y1+(y2-y1)*(sx[j]-sx[0])/(sx[sx.length-1]-sx[0]);
    let shift=0; gr.forEach((i,j)=>{ const need=up?(ny[j]-26)-by(j):by(j)-(ny[j]+26); if(need<shift) shift=need; });
    const B=j=>by(j)+(up?shift:-shift);
    gr.forEach((i,j)=>inBeam[i]={up,tip:B(j),sx:sx[j]});
    const th=up?4.5:-4.5;
    el('polygon',{points:`${sx[0]},${B(0)} ${sx[sx.length-1]},${B(gr.length-1)} ${sx[sx.length-1]},${B(gr.length-1)+th} ${sx[0]},${B(0)+th}`,class:'beam'},svg);
  });

  N.forEach((n,i)=>{
    const x=xs[i], y=yOf(n.step);
    const gN=el('g',{class:'note',id:'n'+i,'data-i':i},svg);
    for(let s=28;s>=n.step;s-=2) el('line',{x1:x-9,x2:x+9,y1:yOf(s),y2:yOf(s),class:'ledger'},gN);
    for(let s=40;s<=n.step;s+=2) el('line',{x1:x-9,x2:x+9,y1:yOf(s),y2:yOf(s),class:'ledger'},gN);
    if(n.showAcc) el('text',{x:x-13,y:y+5,class:'acc','font-size':15,'text-anchor':'middle','font-family':'Noto Music, Segoe UI Symbol, serif'},gN,n.acc>0?'♯':n.acc<0?'♭':'♮');
    el('circle',{cx:x,cy:y,r:10.5,class:'ring'},gN);
    el('ellipse',{cx:x,cy:y,rx:5.6,ry:4.1,transform:`rotate(-20 ${x} ${y})`,class:'head'+(n.dur>=2?' hollow':'')},gN);
    let up=n.step<34, tip=null;
    if(inBeam[i]){ up=inBeam[i].up; tip=inBeam[i].tip; el('line',{x1:inBeam[i].sx,x2:inBeam[i].sx,y1:y,y2:tip,class:'stem'},gN); }
    else if(n.dur<4){
      const sx=up?x+5:x-5; tip=up?y-34:y+34;
      el('line',{x1:sx,x2:sx,y1:y,y2:tip,class:'stem'},gN);
      if(n.dur===.5) el('path',{d:up?`M${sx} ${tip} c1 7 9 9 7 18`:`M${sx} ${tip} c1 -7 9 -9 7 -18`,class:'flag'},gN);
    }
    if([3,1.5].includes(n.dur)){ const dy=(n.step%2===0)?-5:0; el('circle',{cx:x+10,cy:y+dy,r:1.8,class:'dot'},gN); }
    el('rect',{x:spans[i][0],y:4,width:spans[i][1]-spans[i][0],height:104,class:'hit'},gN);
    info[i]={x,y,up,tip};
  });
  // ties
  N.forEach((n,i)=>{ if(n.flag.includes('t')&&N[i+1]){ const a=info[i],b=info[i+1]; const below=a.up; const yy=a.y+(below?7:-7), c=below?9:-9;
    el('path',{d:`M${a.x+4} ${yy} Q${(a.x+b.x)/2} ${yy+c} ${b.x-4} ${yy}`,class:'tie'},svg); } });
  // chord labels
  (ph.chords||[]).forEach((ch,ci)=>{
    const b=ch[0]; const k=ph.items.findIndex(it=>it.on>=b-1e-9); const cx=itemX[k];
    const lab=ph.style==='j'?pretty(ch[2]):((ci===0&&ph.key?ph.key+': ':'')+ch[2]);
    el('text',{x:cx-(ph.style==='c'&&ci===0&&ph.key?10:4),y:120,class:'chord'},svg,lab);
  });
  el('g',{id:'marks'},svg);
  layout={W,xs,info};
}
function drawMarks(ph,marks,user){
  const g=document.getElementById('marks'); g.innerHTML='';
  ph.notes.forEach((n,i)=>{
    const m=marks[i]; if(!m) return;
    const {x,y,up,tip}=layout.info[i];
    const topY=Math.min(TOP-10,(up&&tip!=null?tip:y-6)-10);
    const cls='mark'+(user?' user':'');
    if(m.includes('A')||m.includes('o')) el('path',{d:`M${x-6} ${topY-4} L${x+5} ${topY} L${x-6} ${topY+4}`,class:cls+(m.includes('o')&&!m.includes('A')?' light':'')},g);
    if(m.includes('s')) el('circle',{cx:x,cy:topY+9,r:1.9,class:'sdot'},g);
    if(m.includes('g')){ const pc='paren'+(user?' user':''); el('text',{x:x-12,y:y+5,class:pc,'text-anchor':'middle'},g,'('); el('text',{x:x+12,y:y+5,class:pc,'text-anchor':'middle'},g,')'); }
  });
}
function modelMarks(ph){ return ph.notes.map(n=>n.flag.includes('c')?'':n.flag.replace(/[tc]/g,'')); }

function drawCurves(ph,series){
  const svg=document.getElementById('curve'); svg.innerHTML=''; svg.hidden=false;
  const {W,xs}=layout, H=84, yv=v=>66-v*54;
  const idx=ph.notes.map((n,i)=>i).filter(i=>!ph.notes[i].flag.includes('c'));
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  [[1,'強'],[.5,''],[0,'弱']].forEach(([v,l])=>{ el('line',{x1:30,x2:W-6,y1:yv(v),y2:yv(v),class:'curve-grid'},svg); if(l) el('text',{x:10,y:yv(v)+4,class:'curve-label'},svg,l); });
  const lastX=xs[idx[idx.length-1]];
  const ly=series.map((s,k)=>({k,y:yv(s.v[idx[idx.length-1]])+4})).sort((a,b)=>a.y-b.y);
  for(let j=1;j<ly.length;j++) if(ly[j].y-ly[j-1].y<11) ly[j].y=ly[j-1].y+11;
  const labelY={}; ly.forEach(o=>labelY[o.k]=o.y);
  series.forEach((s,k)=>{
    const pts=idx.map(i=>`${xs[i]},${yv(s.v[i]).toFixed(1)}`).join(' ');
    el('polyline',{points:pts,class:'curve-line',stroke:s.color,'stroke-dasharray':s.dash||''},svg);
    idx.forEach(i=>el('circle',{cx:xs[i],cy:yv(s.v[i]),r:3.4,fill:s.color,class:'curve-dot'},svg));
    if(s.label) el('text',{x:lastX+8,y:labelY[k],class:'curve-label',fill:s.color,'font-weight':700},svg,s.label);
  });
}

/* ================= state & UI ================= */
const S={style:'c',mode:'peak',filter:0,list:[],pos:0,answered:false,rhythm:true,order:null,sel:[],
  score:{'c-peak':[0,0],'c-cmp':[0,0],'j-peak':[0,0],'j-cmp':[0,0]}};
const $=id=>document.getElementById(id);
const set=()=>SETS[S.style];
const cur=()=>set()[S.list[S.pos]];
const PR=()=>prsAll()[S.style];
function noteLabel(ph,i){ return U().noteLabel(i,ph.notes[i].name.replace('#','♯').replace(/b(\d)/,'♭$1')); }

function buildStatic(){
  const box=$('filters'); box.innerHTML='';
  const mk=(v,label)=>{ const b=document.createElement('button'); b.className='chip'; b.id='f'+S.style+v; b.textContent=label; b.setAttribute('aria-pressed',S.filter===v); b.onclick=()=>{ S.filter=v; refreshList(); S.pos=0; buildStatic(); load(); }; box.appendChild(b); };
  mk(0,U().all); Object.entries(PR()).forEach(([k,p])=>mk(+k,k+' '+p.name));
  const pr=$('principles'); pr.querySelectorAll('.pr').forEach(e=>e.remove());
  Object.entries(PR()).forEach(([k,p])=>{ const d=document.createElement('div'); d.className='pr'; d.innerHTML=`<span class="n">${k}</span><div><b>${p.name}</b><span>${p.desc}</span></div>`; pr.appendChild(d); });
  const T=textAll()[S.style];
  $('sub').textContent=T.sub; $('pr-title').textContent=T.prTitle; $('foot').textContent=T.foot; $('mode-peak').textContent=T.modeA;
  $('rhythm').hidden=S.style!=='j'; $('rhythm').textContent=S.rhythm?U().rhythmOn:U().rhythmOff;
  const u=U(); $('h1').textContent=u.title; document.title=u.title; document.documentElement.lang=LANG;
  $('style-c').textContent=u.classical; $('style-j').textContent=u.jazz; $('mode-cmp').textContent=u.compare;
  document.querySelector('.seg.style').setAttribute('aria-label',u.aria.style); document.querySelectorAll('.bar .seg')[1].setAttribute('aria-label',u.aria.mode);
  $('filters').setAttribute('aria-label',u.aria.filters); $('staff').setAttribute('aria-label',u.aria.staff); $('curve').setAttribute('aria-label',u.aria.curve);
  document.querySelectorAll('[data-lang]').forEach(x=>x.setAttribute('aria-selected',x.dataset.lang===LANG));
  ['auto','light','dark'].forEach(k=>{ const b=$('theme-'+k); b.textContent=u.theme[k]; b.setAttribute('aria-selected',THEME===k); });
  $('theme-seg').setAttribute('aria-label',u.theme.label);
  document.querySelectorAll('[data-style]').forEach(x=>x.setAttribute('aria-selected',x.dataset.style===S.style));
  document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-selected',x.dataset.mode===S.mode));
  updScore();
}
function refreshList(){ S.list=set().map((p,i)=>i).filter(i=>!S.filter||set()[i].pr===S.filter); }
function updScore(){ const a=S.score[S.style+'-peak'],b=S.score[S.style+'-cmp']; $('score').textContent=U().score(S.style,a,b); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function colorFor(k){ return ['var(--accent)','var(--c2)','var(--c3)'][k]; }
function btn(label,fn,cls,tri){ const b=document.createElement('button'); b.className='btn '+(cls||''); b.innerHTML=(tri?'<span class="tri"></span>':'')+label; b.onclick=fn; return b; }

function load(){
  stopAll(); S.answered=false;
  const ph=cur();
  $('tag').innerHTML=`<small>${U().principle(ph.pr)}</small>${PR()[ph.pr].name}`;
  $('count').textContent=`${ph.id}　${S.pos+1} / ${S.list.length}`;
  $('pdesc').textContent=PR()[ph.pr].desc;
  drawStaff(ph);
  $('curve').hidden=true; $('curve').innerHTML=''; $('feedback').hidden=true; $('feedback').innerHTML='';
  $('prev').disabled=S.pos===0;
  $('next').textContent=S.pos===S.list.length-1?U().restart:U().next; $('prev').textContent=U().prev;
  const c=$('controls'); c.innerHTML=''; c.className='';
  $('staff').onclick=null; $('staff').classList.remove('pickable');
  if(S.mode==='peak'&&ph.style==='c'){
    $('staff').classList.add('pickable');
    $('prompt').textContent=U().promptPeak;
    c.className='controls';
    c.appendChild(btn(U().plain,()=>playPlain(ph),'',true));
    $('staff').onclick=e=>{ const g=e.target.closest('.note'); if(g&&!S.answered) answerPeak(+g.dataset.i); };
  } else if(S.mode==='peak'){
    S.sel=ph.notes.map(()=>'');
    $('staff').classList.add('pickable');
    $('prompt').innerHTML=U().promptAcc;
    c.className='controls';
    c.appendChild(btn(U().plain,()=>playPlain(ph),'',true));
    c.appendChild(btn(U().mine,()=>playJ(ph,artFromSel(ph,S.sel)),'',true));
    c.appendChild(btn(U().check,()=>answerAcc(),'primary'));
    c.appendChild(btn(U().clear,()=>{ S.sel=ph.notes.map(()=>''); paintSel(ph); },'ghost'));
    $('staff').onclick=e=>{ const g=e.target.closest('.note'); if(!g||S.answered) return; let i=+g.dataset.i; if(ph.notes[i].flag.includes('c')) i--; S.sel[i]=S.sel[i]===''?'A':S.sel[i]==='A'?'g':''; paintSel(ph); };
  } else {
    $('prompt').textContent=ph.style==='j'?U().promptCmpJ:U().promptCmpC;
    S.order=shuffle([null,...ph.dist]);
    c.className='opts';
    S.order.forEach((d,k)=>{
      const o=document.createElement('div'); o.className='opt'; o.id='opt'+k;
      o.innerHTML=`<span class="lbl"><span class="sw" style="background:${colorFor(k)}"></span>${'ABC'[k]}</span>`;
      o.appendChild(btn(U().listen,()=>play(ph,d),'',true));
      const pick=btn(U().choose,()=>answerCmp(k),'primary'); pick.classList.add('pick'); o.appendChild(pick);
      const w=document.createElement('span'); w.className='what'; o.appendChild(w);
      c.appendChild(o);
    });
  }
}
function paintSel(ph){
  ph.notes.forEach((n,i)=>{ const g=$('n'+i); g.classList.toggle('sel-a',S.sel[i]==='A'); g.classList.toggle('sel-g',S.sel[i]==='g'); });
  drawMarks(ph,S.sel,true);
}

function hintFor(ph,i){
  const n=ph.notes[i];
  const H=U().hint;
  if(i===ph.notes.length-1) return H.last;
  if(n.flag==='p') return H.p;
  if(n.flag==='r') return H.r;
  if(i===0) return H.first;
  if(n.dur<1) return H.short;
  return H.mid;
}
function answerPeak(i){
  const ph=cur(); S.answered=true;
  const isBest=i===ph.peak, isAlt=i in ph.alt, sc=S.score['c-peak'];
  sc[1]++; if(isBest||isAlt) sc[0]++; updScore();
  document.querySelectorAll('.note').forEach(g=>{ const k=+g.dataset.i; if(k===ph.peak) g.classList.add('best'); if(k in ph.alt) g.classList.add('alt'); });
  const g=$('n'+i); g.classList.add('chosen'); if(isBest||isAlt) g.classList.add('right');
  $('staff').classList.remove('pickable');
  const model=versionC(ph,null);
  drawCurves(ph,[{v:model,color:'var(--good)',label:U().model}]);
  const fb=$('feedback'); fb.hidden=false;
  let html='';
  const u=U(), sep=LANG==='en'?': ':'：', sp=LANG==='en'?' ':'';
  if(isBest) html+=`<p class="verdict good">${u.vBest}</p><p>${whyOf(ph)}</p>`;
  else if(isAlt) html+=`<p class="verdict mid">${u.vAlt}</p><p>${altOf(ph,i)}</p><p class="hint">${u.modelIs(noteLabel(ph,ph.peak))}${sp}${whyOf(ph)}</p>`;
  else html+=`<p class="verdict bad">${u.vBad}</p><p class="hint">${cap(noteLabel(ph,i))}${sep}${hintFor(ph,i)}</p><p>${u.modelIs(noteLabel(ph,ph.peak))}${sp}${whyOf(ph)}</p>`;
  fb.innerHTML=html;
  const row=document.createElement('div'); row.className='controls';
  row.appendChild(btn(U().playModel,()=>playC(ph,model),'primary',true));
  row.appendChild(btn(U().plain,()=>playPlain(ph),'',true));
  fb.appendChild(row);
}

function whyJ(ph,i,kind){
  const n=ph.notes[i], N=ph.notes, maxM=Math.max(...N.map(x=>x.midi));
  const W=U().wj;
  if(kind==='missA'){
    if(i===N.length-1) return W.last;
    if(n.flag.includes('t')) return W.tie;
    if(n.midi===maxM) return W.top;
    if(isOff(n)) return W.off;
    return W.acc;
  }
  if(kind==='missG') return W.missG;
  if(kind==='extraA'){ if(n.flag.includes('g')) return W.xG; return isOff(n)?W.xOff:W.xOn; }
  if(kind==='extraG') return n.flag.includes('A')?W.gA:W.gNo;
  return '';
}
function answerAcc(){
  const ph=cur(); S.answered=true; $('staff').classList.remove('pickable');
  const N=ph.notes, res={hitA:0,hitG:0,M:0,G:0,list:[]};
  N.forEach((n,i)=>{
    if(n.flag.includes('c')) return;
    const f=n.flag, s=S.sel[i], wantA=f.includes('A'), wantG=f.includes('g'), opt=f.includes('o');
    if(wantA) res.M++; if(wantG) res.G++;
    const g=$('n'+i); g.classList.remove('sel-a','sel-g');
    if(wantA&&s==='A'){ res.hitA++; g.classList.add('hit'); }
    else if(wantG&&s==='g'){ res.hitG++; g.classList.add('hit'); }
    else {
      if(wantA){ g.classList.add('missed'); res.list.push([i,'missA']); }
      if(wantG){ g.classList.add('missed'); res.list.push([i,'missG']); }
      if(s==='A'&&!wantA&&!opt){ g.classList.add('extra'); res.list.push([i,'extraA']); }
      else if(s==='A'&&opt){ g.classList.add('hit'); }
      if(s==='g'&&!wantG){ g.classList.add('extra'); res.list.push([i,'extraG']); }
    }
  });
  const extras=res.list.filter(x=>x[1].startsWith('extra')).length;
  const perfect=res.hitA===res.M&&res.hitG===res.G&&extras===0;
  const sc=S.score['j-peak']; sc[1]++; if(perfect) sc[0]++; updScore();
  drawMarks(ph,modelMarks(ph),false);
  drawCurves(ph,[{v:jart(ph,null).v,color:'var(--good)',label:U().model}]);
  const fb=$('feedback'); fb.hidden=false;
  const near=!perfect&&res.list.length<=2;
  const u=U(), sep=LANG==='en'?': ':'：', lg=u.legend;
  let html=`<p class="verdict ${perfect?'good':near?'mid':'bad'}">${perfect?u.vAll:near?u.vNear:u.vFar}</p>`;
  html+=`<div class="tally"><span>${u.tA(res.hitA,res.M)}</span>${res.G?`<span>${u.tG(res.hitG,res.G)}</span>`:''}<span>${u.tX(extras)}</span></div>`;
  html+=`<p>${whyOf(ph)}</p>`;
  if(res.list.length){ html+='<ul class="vlist">'; res.list.forEach(([i,k])=>{ const lab=u.kinds[k]; html+=`<li><span class="k" style="color:var(--${k.startsWith('miss')?'good':'warn'})">${i+1}</span><span><b>${lab}</b>　${cap(noteLabel(ph,i))}${sep}${whyJ(ph,i,k)}</span><span></span></li>`; }); html+='</ul>'; }
  html+=`<div class="legend"><span><b>&gt;</b>${lg[0]}</span><span><b style="opacity:.45">&gt;</b>${lg[1]}</span><span><b>( )</b>${lg[2]}</span><span><b>・</b>${lg[3]}</span><span>${lg[4]}</span></div>`;
  fb.innerHTML=html;
  const row=document.createElement('div'); row.className='controls';
  row.appendChild(btn(U().playModelJ,()=>play(ph,null),'primary',true));
  row.appendChild(btn(U().mine,()=>playJ(ph,artFromSel(ph,S.sel)),'',true));
  fb.appendChild(row);
}

function answerCmp(k){
  if(S.answered) return;
  const ph=cur(); S.answered=true;
  const D=distsAll()[ph.style];
  const mi=S.order.indexOf(null), ok=k===mi, sc=S.score[ph.style+'-cmp'];
  sc[1]++; if(ok) sc[0]++; updScore();
  $('controls').classList.add('answered');
  S.order.forEach((d,j)=>{
    const o=$('opt'+j); o.querySelector('.pick').disabled=true;
    if(j===mi) o.classList.add('model'); else if(j===k) o.classList.add('picked');
    o.querySelector('.what').textContent=d?D[d.t].name:U().model;
  });
  if(ph.style==='j') drawMarks(ph,modelMarks(ph),false);
  drawCurves(ph,S.order.map((d,j)=>({v:version(ph,d),color:colorFor(j),label:'ABC'[j],dash:d?'5 4':''})));
  const fb=$('feedback'); fb.hidden=false;
  let html=ok?`<p class="verdict good">${U().cmpOk('ABC'[k])}</p>`:`<p class="verdict bad">${U().cmpBad('ABC'[mi])}</p>`;
  html+=`<p>${whyOf(ph)}</p><ul class="vlist">`;
  S.order.forEach((d,j)=>{ if(d) html+=`<li><span class="k" style="color:${colorFor(j)}">${'ABC'[j]}</span><span><b>${D[d.t].name}</b>　${d.t==='peakAt'?dwOf(ph,d):D[d.t].text}</span><span></span></li>`; });
  html+='</ul>';
  fb.innerHTML=html;
  const js=S.order.map((d,jj)=>d?jj:-1).filter(x=>x>=0);
  fb.querySelectorAll('.vlist li').forEach((li,n)=>{ const j=js[n]; li.lastChild.appendChild(btn(U().listen,()=>play(ph,S.order[j]),'',true)); });
  const row=document.createElement('div'); row.className='controls';
  row.appendChild(btn(U().again('ABC'[mi]),()=>play(ph,null),'primary',true));
  fb.appendChild(row);
}

document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ S.mode=b.dataset.mode; buildStatic(); load(); });
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{
  if(S.style===b.dataset.style) return;
  S.style=b.dataset.style; S.filter=0; S.pos=0; refreshList(); buildStatic(); load();
  try{ localStorage.setItem('yokuyo-style',S.style); }catch(e){}
});
$('rhythm').onclick=()=>{ S.rhythm=!S.rhythm; $('rhythm').setAttribute('aria-pressed',S.rhythm); $('rhythm').textContent=S.rhythm?U().rhythmOn:U().rhythmOff; };
$('prev').onclick=()=>{ if(S.pos>0){ S.pos--; load(); } };
$('next').onclick=()=>{ S.pos=(S.pos+1)%S.list.length; load(); };

try{ const st=localStorage.getItem('yokuyo-style'); if(st==='j'||st==='c') S.style=st; }catch(e){}
const cap=s=>LANG==='en'?s.charAt(0).toUpperCase()+s.slice(1):s;
var THEME='auto';
const HOST_THEME=document.documentElement.getAttribute('data-theme');
function applyTheme(){
  const r=document.documentElement;
  if(THEME==='auto'){ if(HOST_THEME) r.setAttribute('data-theme',HOST_THEME); else r.removeAttribute('data-theme'); }
  else r.setAttribute('data-theme',THEME);
}
try{ const t=localStorage.getItem('phrasing-theme'); if(t==='light'||t==='dark'||t==='auto') THEME=t; }catch(e){}
applyTheme();
document.querySelectorAll('[data-theme-opt]').forEach(b=>b.onclick=()=>{
  THEME=b.dataset.themeOpt; applyTheme();
  try{ localStorage.setItem('phrasing-theme',THEME); }catch(e){}
  document.querySelectorAll('[data-theme-opt]').forEach(x=>x.setAttribute('aria-selected',x.dataset.themeOpt===THEME));
});
(function(){
  let l=null; try{ l=localStorage.getItem('phrasing-lang'); }catch(e){}
  if(l!=='ja'&&l!=='en'){ const langs=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'ja']; l=/^ja\b/i.test(langs[0]||'')?'ja':'en'; }
  LANG=l;
})();
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{
  if(LANG===b.dataset.lang) return; LANG=b.dataset.lang;
  try{ localStorage.setItem('phrasing-lang',LANG); }catch(e){}
  buildStatic(); load();
});
refreshList(); buildStatic(); load();
</script>

</body>
</html>
